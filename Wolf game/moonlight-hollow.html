<title>A Wolf's Calling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 game viewport centred on black; every HUD layer sits inside it. */
:root{
  --void:#020306;
  --ink:#d7deea;
  --dim:#7d8aa3;
  --moon:#eef2f6;
  --blood:#8e0f12;
  --display:'Cinzel','Trajan Pro',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--void);color:var(--ink);font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:100%;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{position:relative;width:min(100%,calc((100vh - 24px) * 16 / 9));max-width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.65) 100%)}
#red{background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(140,4,8,.9) 100%);opacity:0;mix-blend-mode:multiply}
#flash{background:#e9eef7;opacity:0}
.bar{position:absolute;left:0;right:0;height:11%;background:#000;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
.loc{position:absolute;left:5%;top:15%;display:flex;flex-direction:column;gap:6px;font-size:clamp(9px,1.2vw,14px);letter-spacing:.28em;text-transform:uppercase;opacity:0;pointer-events:none}
.loc b{font-weight:500;color:var(--moon)}
.loc span{color:var(--dim)}
.title-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,16px);pointer-events:none;opacity:0;text-align:center;padding-bottom:12%}
.title-card h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(26px,6.4vw,92px);letter-spacing:.14em;color:var(--moon);text-shadow:0 0 40px rgba(150,180,230,.35),0 4px 30px rgba(0,0,0,.9);text-wrap:balance}
.title-card .tag{margin:0;font-size:clamp(9px,1.2vw,15px);letter-spacing:.5em;text-transform:uppercase;color:#c3473f}
.press{position:absolute;bottom:13%;left:0;right:0;text-align:center;font-size:clamp(10px,1.3vw,15px);letter-spacing:.45em;color:var(--ink);pointer-events:none;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.skip{position:absolute;right:3.5%;bottom:14%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--dim);font:500 clamp(9px,1vw,12px) var(--mono);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:6px}
.skip svg{width:22px;height:22px;transform:rotate(-90deg)}
.skip circle{fill:none;stroke-width:2.5}
.skip:hover{color:var(--ink)}
.snd{position:absolute;right:max(10px,2%);top:max(10px,2%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(238,242,246,.25);background:rgba(0,0,0,.35);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:5}
.snd svg{width:16px;height:16px}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,22px);background:radial-gradient(ellipse at center,rgba(2,3,6,.25),rgba(2,3,6,.85));text-align:center;padding:16px;z-index:4}
.start h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,70px);letter-spacing:.14em;color:var(--moon);text-shadow:0 4px 30px rgba(0,0,0,.9)}
.start p{margin:0;font-size:clamp(9px,1.1vw,13px);letter-spacing:.28em;text-transform:uppercase;color:var(--ink);opacity:.8}
.begin{margin-top:4px;font:500 clamp(11px,1.2vw,14px) var(--mono);letter-spacing:.4em;text-transform:uppercase;color:var(--moon);background:rgba(142,15,18,.25);border:1px solid rgba(195,71,63,.7);padding:.9em 2.2em .9em 2.6em;cursor:pointer;transition:background .2s}
.begin:hover{background:rgba(142,15,18,.55)}
button:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.press{animation:none;opacity:.8}}
</style>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){$('stage').insertAdjacentHTML('beforeend','<div class="err">The 3D engine could not load. Check your connection and reload the page.</div>');return}
let gl;try{gl=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'})}catch(e){$('stage').insertAdjacentHTML('beforeend','<div class="err">This browser could not start WebGL, which the cinematic needs.</div>');return}

const PI=Math.PI,TAU=PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=(a,b,v)=>{const u=clamp((v-a)/(b-a));return u*u*(3-2*u)};
const bump=(t,a,b,c,d)=>sm(a,b,t)*(1-sm(c,d,t));
const ease=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const pulse=(t,x,k=3)=>t>=x?Math.exp(-(t-x)*k):0;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(4242);
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const mat=(h,r=.92)=>new THREE.MeshStandardMaterial({color:lin(h),roughness:r,flatShading:true});

/* ================= timing ================= */
const TI=61.4,INTRO=80;
const tsF=t=>1-.65*bump(t,40.5,40.9,42.9,43.3)-.72*bump(t,59.8,60.1,61.5,61.9);
const vD=t=>t<17.8?0:t<TI?13*sm(17.8,19,t)-1.5*sm(52,60,t):11.5*Math.exp(-(t-TI)*2.2);
const GK=[[17.5,18],[22,14],[28,11],[34,5.5],[40,6.5],[44,6.5],[50,4.5],[52.6,1.7],[53.3,3.2],[56,2.4],[57.2,1.2],[58.2,2.8],[60,3.3],[61.4,.9]];
function Gf(t){if(t<=GK[0][0])return GK[0][1];for(let i=1;i<GK.length;i++)if(t<=GK[i][0]){const[a,va]=GK[i-1],[b,vb]=GK[i];return lerp(va,vb,(1-Math.cos(PI*(t-a)/(b-a)))/2)}return GK[GK.length-1][1]}
const latD=t=>{t=Math.min(t,TI);return 1.4*Math.sin(t*.7)*sm(19,21,t)-1.2*bump(t,57.2,57.6,58.4,59.6)};
const latW=t=>{const base=7*(1-sm(17.6,19.6,t))+1.2*Math.sin(t*.7-.5)*sm(19,21,t);return lerp(base,latD(t)+.85,bump(t,55.6,57.1,57.4,58.8))};
const DT=.01,NT=Math.ceil(110/DT)+2;
const TD=new Float64Array(NT),TW=new Float64Array(NT),PD=new Float64Array(NT),PW=new Float64Array(NT);
TD[0]=30;for(let i=1;i<NT;i++){const t=i*DT;TD[i]=TD[i-1]+vD(t)*tsF(t)*DT}
for(let i=0;i<NT;i++){const t=i*DT;TW[i]=t<17.5?12:TD[i]-Gf(t)}
for(let i=1;i<NT;i++){PD[i]=PD[i-1]+TAU*((TD[i]-TD[i-1])/DT)/5*DT;PW[i]=PW[i-1]+TAU*Math.max(0,(TW[i]-TW[i-1])/DT)/5.2*DT}
const at=(a,t)=>{const x=clamp(t/DT,0,NT-2),i=Math.floor(x);return a[i]+(a[i+1]-a[i])*(x-i)};
const SNAPS=[31.6,32.5,36.2,37.4,38.6,52.6];
const snapJaw=t=>{let m=0;for(const s of SNAPS)m=Math.max(m,.8*sm(s-.32,s-.1,t)*(1-sm(s-.03,s+.01,t)));return m};

/* ================= path & terrain ================= */
const pts=[];for(let i=0;i<=34;i++)pts.push(new THREE.Vector3(i*24-20,0,14*Math.sin(i*.9)+6*Math.sin(i*2.1)));
const curve=new THREE.CatmullRomCurve3(pts),PL=curve.getLength(),NS=Math.floor(PL)+2;
const SX=new Float32Array(NS),SZ=new Float32Array(NS),TX=new Float32Array(NS),TZ=new Float32Array(NS);
for(let i=0;i<NS;i++){const u=Math.min(1,i/PL),p=curve.getPointAt(u),g=curve.getTangentAt(u),l=Math.hypot(g.x,g.z);SX[i]=p.x;SZ[i]=p.z;TX[i]=g.x/l;TZ[i]=g.z/l}
const Hf=(x,z)=>.45*Math.sin(x*.07+1)*Math.cos(z*.09)+.22*Math.sin(x*.23+z*.17)+.12*Math.sin(z*.4+x*.05);
function pathAt(s,lat,o){s=clamp(s,0,NS-1.001);const i=Math.floor(s),f=s-i;let ux=lerp(TX[i],TX[i+1],f),uz=lerp(TZ[i],TZ[i+1],f);const l=Math.hypot(ux,uz);ux/=l;uz/=l;
  o.x=lerp(SX[i],SX[i+1],f)+uz*lat;o.z=lerp(SZ[i],SZ[i+1],f)-ux*lat;o.y=Hf(o.x,o.z);o.tx=ux;o.tz=uz;o.nx=uz;o.nz=-ux;return o}
const CELL=8,grid=new Map();
for(let i=0;i<NS;i++){const k=Math.floor(SX[i]/CELL)+','+Math.floor(SZ[i]/CELL);if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i)}
function pDist(x,z){const cx=Math.floor(x/CELL),cz=Math.floor(z/CELL);let m=1e9;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const L=grid.get((cx+a)+','+(cz+b));if(L)for(const i of L){const dx=x-SX[i],dz=z-SZ[i],d=dx*dx+dz*dz;if(d<m)m=d}}return m<1e9?Math.sqrt(m):99}
const MOON_DIR=new THREE.Vector3(-.55,.42,-.72).normalize();
const MX=MOON_DIR.x/Math.hypot(MOON_DIR.x,MOON_DIR.z),MZ=MOON_DIR.z/Math.hypot(MOON_DIR.x,MOON_DIR.z);
const S_LOG=at(TD,41.4);
const tmp={};
const START=pathAt(30,0,{}),BUSH=pathAt(12,7,{}),LOG=pathAt(S_LOG,0,{}),KILL=pathAt(at(TD,70),latD(TI),{});
let YAW_TI;{const a=pathAt(at(TD,TI),latD(TI),{}),b=pathAt(at(TD,TI)+.5,latD(TI),{});YAW_TI=Math.atan2(b.x-a.x,b.z-a.z)}

/* ================= renderer & scene ================= */
const stage=$('stage');
gl.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
gl.shadowMap.enabled=true;gl.shadowMap.type=THREE.PCFSoftShadowMap;
gl.outputEncoding=THREE.sRGBEncoding;gl.toneMapping=THREE.ACESFilmicToneMapping;gl.toneMappingExposure=1.25;
const scene=new THREE.Scene();
const FOGC=new THREE.Color(.006,.0095,.022);
scene.background=FOGC.clone();scene.fog=new THREE.FogExp2(FOGC,.03);
const camera=new THREE.PerspectiveCamera(45,16/9,.06,800);
let dirty=true;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;gl.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true}
new ResizeObserver(resize).observe(stage);resize();

const hemi=new THREE.HemisphereLight(lin(0x41598a),lin(0x07080c),.75);scene.add(hemi);
const moonLight=new THREE.DirectionalLight(lin(0xb4c8f2),2.1);
moonLight.castShadow=true;moonLight.shadow.mapSize.set(2048,2048);
Object.assign(moonLight.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:180});
moonLight.shadow.bias=-.0005;moonLight.shadow.normalBias=.04;
scene.add(moonLight,moonLight.target);

function canvasTex(size,draw){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
const glowTex=canvasTex(128,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const softTex=canvasTex(128,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s)});
const moonTex=canvasTex(256,(g,s)=>{g.beginPath();g.arc(128,128,124,0,TAU);g.clip();const r=g.createRadialGradient(105,100,5,128,128,128);r.addColorStop(0,'#fdfdf8');r.addColorStop(.75,'#e2e7ec');r.addColorStop(1,'#aeb9c6');g.fillStyle=r;g.fillRect(0,0,s,s);
  [[150,95,40],[98,150,32],[168,162,24],[88,82,18],[130,195,16]].forEach(([x,y,q])=>{const m=g.createRadialGradient(x,y,0,x,y,q);m.addColorStop(0,'rgba(100,112,132,.25)');m.addColorStop(1,'rgba(100,112,132,0)');g.fillStyle=m;g.fillRect(x-q,y-q,q*2,q*2)})});

const sky=new THREE.Mesh(new THREE.SphereGeometry(650,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{md:{value:MOON_DIR},hz:{value:FOGC},zn:{value:new THREE.Color(.0005,.0008,.003)}},
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 md,hz,zn;varying vec3 vD;void main(){vec3 d=normalize(vD);float h=clamp(d.y,0.,1.);vec3 c=mix(hz,zn,smoothstep(0.,.5,h));float m=max(dot(d,md),0.);c+=vec3(.05,.07,.12)*(pow(m,60.)*1.2+pow(m,8.)*.25);gl_FragColor=vec4(c,1.);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'}));
sky.renderOrder=-10;scene.add(sky);
const skyGroup=new THREE.Group();scene.add(skyGroup);
{const n=900,p=new Float32Array(n*3),r=rng(7);for(let i=0;i<n;i++){const u=r()*TAU,v=.08+r()*.92,c=Math.sqrt(1-v*v);p[i*3]=Math.cos(u)*c*600;p[i*3+1]=v*600;p[i*3+2]=Math.sin(u)*c*600}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 skyGroup.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfd8ea,size:1.4,sizeAttenuation:false,fog:false,transparent:true,opacity:.75,depthWrite:false})))}
const moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x8fa6d4,transparent:true,opacity:.42,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,toneMapped:false}));
moonGlow.scale.set(340,340,1);moonGlow.position.copy(MOON_DIR).multiplyScalar(560);skyGroup.add(moonGlow);
const moonSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:moonTex,fog:false,toneMapped:false,depthWrite:false}));
moonSpr.scale.set(46,46,1);moonSpr.position.copy(MOON_DIR).multiplyScalar(560);skyGroup.add(moonSpr);

/* ground */
{const g=new THREE.PlaneGeometry(1000,300,250,75);g.rotateX(-PI/2);g.translate(380,0,0);
 const p=g.attributes.position,col=new Float32Array(p.count*3),c=new THREE.Color(),r=rng(3);
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,Hf(x,z));const d=pDist(x,z);
   if(d<2.4)c.setRGB(.17,.15,.13);else c.setHSL(.28+r()*.08,.22,.07+r()*.05);
   const k=clamp((d-2.4)/1.5);if(d<3.9&&d>=2.4)c.lerp(new THREE.Color(.17,.15,.13),1-k);
   c.convertSRGBToLinear();col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}
 g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true}));m.receiveShadow=true;scene.add(m)}

/* forest */
const dummy=new THREE.Object3D(),C3=new THREE.Color();
const clearings=[[START.x,START.z,14],[BUSH.x,BUSH.z,4.2],[KILL.x,KILL.z,15],[LOG.x,LOG.z,5]];
function blocked(x,z){for(const[cx,cz,r]of clearings)if((x-cx)**2+(z-cz)**2<r*r)return true;
  for(const w of[START,KILL]){const dx=x-w.x,dz=z-w.z,al=dx*MX+dz*MZ;if(al>0&&al<170&&Math.abs(-dx*MZ+dz*MX)<9+al*.12)return true}return false}
function inst(geo,m,n,cast,recv){const I=new THREE.InstancedMesh(geo,m,n);I.castShadow=cast;I.receiveShadow=recv;I.frustumCulled=false;scene.add(I);return I}
{const tg=new THREE.CylinderGeometry(.6,1,1,6);tg.translate(0,.5,0);const cg=new THREE.ConeGeometry(1,1,7);cg.translate(0,.5,0);
 const MAXT=1800,trunks=inst(tg,mat(0x3a2f26),MAXT,true,true),cones=inst(cg,mat(0x1d3529),MAXT*4,true,true);
 let nt=0,nc=0;const r=rng(11);
 for(let k=0;k<9000&&nt<MAXT;k++){const i=Math.floor(r()*NS),sd=r()<.5?-1:1,lat=sd*(3.8+Math.pow(r(),1.4)*64);
   const x=SX[i]+TZ[i]*lat,z=SZ[i]-TX[i]*lat;if(pDist(x,z)<3.6||blocked(x,z))continue;
   const h=10+r()*12,rt=.2+r()*.32,y=Hf(x,z)-.3,dead=r()<.16;
   dummy.position.set(x,y,z);dummy.rotation.set((r()-.5)*.04,r()*TAU,(r()-.5)*.04);dummy.scale.set(rt,dead?h*1.1:h*.8,rt);dummy.updateMatrix();
   trunks.setMatrixAt(nt,dummy.matrix);C3.setHSL(.07,.2,.1+r()*.08).convertSRGBToLinear();trunks.setColorAt(nt,C3);nt++;
   if(!dead)for(let q=0;q<4;q++){const b=h*(.3+q*.16),hh=h*.36,rr=h*(.2-q*.036)*(.85+.3*r());dummy.position.set(x+(r()-.5)*.3,y+b,z+(r()-.5)*.3);dummy.rotation.set(0,r()*TAU,0);dummy.scale.set(rr,hh,rr);dummy.updateMatrix();
     cones.setMatrixAt(nc,dummy.matrix);C3.setHSL(.36+r()*.08,.32,.13+r()*.07).convertSRGBToLinear();cones.setColorAt(nc,C3);nc++}}
 trunks.count=nt;cones.count=nc;trunks.instanceColor.needsUpdate=true;cones.instanceColor.needsUpdate=true;
 // bushes

    for(let t=.005;t<Math.min(len,TI);t+=.005){const k1=Math.floor(at(arr,t)/PI);if(k1>k0){const s=isD?at(TD,t):at(TW,t);
      if(Math.abs(s-S_LOG)>=3.2&&(isD||t<=60))thump(t,stepVol(t,isD)*(k1%2?.7:1),isD?1300:420);k0=k1}}}
  const buf=await OC.startRendering();[AC,MG,WG,DG,DLP,REV,NB]=saved;return wav(buf)};
function audioParams(t,n){if(!AC)return;if(n===undefined)n=AC.currentTime;const quiet=t>=TI&&t<62.3;
  WG.gain.setTargetAtTime(quiet?.03:t>=40.5&&t<43.3?.04:.1,n,.4);
  DG.gain.setTargetAtTime(t<13?0:t<TI?.025+.06*clamp((t-13)/48):t<77.5?.02:.05,n,t>=TI&&t<61.6?.05:.6);
  DLP.frequency.setTargetAtTime(t<TI?150+800*clamp((t-17)/44):t<77.5?160:420,n,.5)}
function footfalls(a,b){if(b>=TI||b<=a||b-a>.3)return;
  for(const[arr,isD]of[[PD,1],[PW,0]]){const s=isD?at(TD,b):at(TW,b);if(Math.abs(s-S_LOG)<3.2)continue;if(!isD&&b>60)continue;
    const k0=Math.floor(at(arr,a)/PI),k1=Math.floor(at(arr,b)/PI);if(k1<=k0)continue;
    const p=isD?st.dp:st.wp,dist=camera.position.distanceTo(p);
    for(let k=k0+1;k<=Math.min(k1,k0+2);k++){emit(DUST,p.x,p.y+.05,p.z,4,1.6,.5,1.6);if(AC)thump(AC.currentTime+.02,clamp(5/(dist+1.5))*(k%2?.7:1),isD?1300:420)}}}

/* ================= HUD & loop ================= */
const red=$('red'),flash=$('flash'),barT=$('barT'),barB=$('barB'),loc=$('loc'),tc=$('titleCard'),press=$('press'),skipB=$('skip'),ring=$('skipRing');
let T=57.15,playing=false,started=false,lastNow=performance.now(),holdSkip=0,skipDown=false,lastPress=0;
function hud(t){
  const bars=11*(1-sm(77,79,t));barT.style.height=barB.style.height=bars+'%';
  red.style.opacity=Math.min(1,.28*bump(t,50,50.15,55.15,55.3)+.55*pulse(t,TI,2)+.35*(pulse(t,62.6,2.5)+pulse(t,64,2.5)+pulse(t,65.5,2.5))+.3*pulse(t,57.2,3)+.18*bump(t,61.5,62,67,69));
  flash.style.opacity=.9*pulse(t,TI,7)+.25*pulse(t,57.2,8);
  loc.style.opacity=bump(t,1.2,2,5.6,6.6);
  tc.style.opacity=sm(77.6,79,t);
  press.hidden=!(started&&t>79.5);
  skipB.hidden=!(started&&playing&&t>1.5&&t<76);
}
function update(t,dt){
  poseDeer(t);poseWolf(t);poseArrows(t,dt);shotPose(t);
  skyGroup.position.copy(camera.position);sky.position.copy(camera.position);
  const tg=t<TI?st.dp:KILL;moonLight.target.position.set(tg.x,tg.y,tg.z);moonLight.position.set(tg.x+MOON_DIR.x*80,tg.y+MOON_DIR.y*80,tg.z+MOON_DIR.z*80);
  if(dt>0){const sdt=dt*tsF(t);
    if(t>TI&&t<62.6&&Math.random()<.9)emit(DUST,st.dp.x,st.dp.y+.1,st.dp.z,6,3,1.2,1.4);
    for(const b of[TI,62.6,64,65.5])if(t-dt<b&&t>=b){emit(BLOOD,st.thr.x,st.thr.y,st.thr.z,b===TI?40:120,3.2,2.6,2.5);emit(BL2,st.thr.x,st.thr.y,st.thr.z,30,1.8,1.2,2.5);if(b===TI)emit(DUST,st.dp.x,st.dp.y+.2,st.dp.z,80,6,2,2)}
    const sh=bump(t,62.3,62.5,66.8,67.2);if(sh>0&&Math.random()<.6)emit(BLOOD,st.thr.x,st.thr.y,st.thr.z,3,2,1.4,2.5);
    if(t>69.3&&t<72.2&&Math.random()<.08)emit(BL2,st.wHead.x,st.wHead.y-.08,st.wHead.z,1,.2,.1,3);
    stepPool(DUST,sdt,.6,1.6,false);stepPool(BLOOD,sdt,9.8,.3,true);stepPool(BL2,sdt,9.8,.2,true)}
  const ps=sm(62.6,70,t)*(t>TI?1:0);pool3.visible=ps>0;if(ps>0){pool3.position.set(st.thr.x,Hf(st.thr.x,st.thr.z)+.03,st.thr.z);pool3.scale.setScalar(.15+1.3*ps)}
  hud(t);audioParams(t);
}
let lastT=T;
function loop(now){
  const dt=Math.min(.05,(now-lastNow)/1000);lastNow=now;
  if(playing){const a=T;T+=dt;audioTick(a,T);update(T,dt);footfalls(a,T);dirty=true}
  if(skipDown&&started&&T<76){holdSkip+=dt;if(holdSkip>=.9){T=76.5;clearPools();holdSkip=0;skipDown=false}}else if(!skipDown)holdSkip=Math.max(0,holdSkip-dt*2);
  ring.style.strokeDashoffset=56.5*(1-holdSkip/.9);
  if(dirty){if(!playing)update(T,0);gl.render(scene,camera);dirty=false}
  requestAnimationFrame(loop);
}
function begin(){if(!AC)initAudio();if(AC&&AC.state==='suspended')AC.resume();clearPools();T=0;started=true;playing=true;$('start').hidden=true;lastNow=performance.now()}
$('begin').onclick=begin;
$('snd').onclick=e=>{e.stopPropagation();muted=!muted;if(MG)MG.gain.setTargetAtTime(muted?0:1,AC.currentTime,.05);$('sndWave').style.opacity=muted?.15:1;$('snd').setAttribute('aria-label',muted?'Unmute sound':'Mute sound')};
const restart=()=>{if(performance.now()-lastPress<400)return;lastPress=performance.now();clearPools();T=0};
window.addEventListener('keydown',e=>{
  if(!started){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();begin()}return}
  if(e.code==='Space'){e.preventDefault();if(T<76)skipDown=true}
  if(T>79.5&&!e.repeat)restart();
});
window.addEventListener('keyup',e=>{if(e.code==='Space')skipDown=false});
skipB.addEventListener('pointerdown',e=>{e.stopPropagation();skipDown=true});
['pointerup','pointerleave','pointercancel'].forEach(k=>skipB.addEventListener(k,()=>skipDown=false));
stage.addEventListener('pointerdown',e=>{if(started&&T>79.5&&e.target!==$('snd'))restart()});
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():(started&&AC.resume())});
window.__seek=t=>{T=t;clearPools();if(!started){started=true;$('start').hidden=true}dirty=true};
update(T,0);requestAnimationFrame(loop);
})();
</script>
